<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play | uwZoom.com</title>
    <meta
      name="description"
      content="Guess the image before uwZoom.com fully zooms out."
    />
    <link rel="icon" href="/University_of_Waterloo_seal.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/play.css" />
  </head>
  <body class="play-page">
    <div class="play-shell">
      <main class="play-layout">
        <section class="panel play-panel">
          <div class="image-stage">
            <div class="image-frame">
              <div class="play-loading" id="play-loading" aria-live="polite">
                <div class="play-loading-mark" aria-hidden="true"></div>
                <p class="play-loading-copy" id="play-loading-copy">Loading first image...</p>
              </div>
              <img id="game-image" alt="Current round" />
            </div>
          </div>

          <form class="guess-form" id="guess-form" autocomplete="off">
            <div class="guess-meta">
              <label class="field-label" for="guess-input">Your guess</label>
              <p class="status-message" id="feedback" data-tone="default"></p>
            </div>
            <div class="guess-row">
              <div class="autocomplete-shell">
                <div class="autocomplete-ghost" aria-hidden="true">
                  <span class="autocomplete-typed" id="ghost-typed"></span><span
                    class="autocomplete-suffix"
                    id="ghost-suffix"
                  ></span>
                </div>
                <input
                  class="text-input autocomplete-input"
                  id="guess-input"
                  name="guess"
                  type="text"
                  placeholder="WatCard, Dana Porter, goose..."
                  maxlength="80"
                  required
                />
              </div>
              <button class="button button-primary" type="submit">Guess</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script type="module" src="/scripts/play.js"></script>
  </body>
</html>
