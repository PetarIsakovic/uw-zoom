<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UW Zoom</title>
    <meta
      name="description"
      content="UW Zoom is a minimal image-guessing game that starts absurdly zoomed in and slowly reveals the picture."
    />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/landing.css" />
  </head>
  <body class="landing-shell">
    <header class="site-header site-header-end">
      <nav class="header-actions" aria-label="Primary">
        <a class="ghost-button" href="/upload/">Upload</a>
      </nav>
    </header>

    <main class="landing-main">
      <div class="landing-grid">
        <aside class="landing-leaderboard" aria-label="Top streaks">
          <p class="landing-leaderboard-label">Top streaks</p>
          <ol class="landing-leaderboard-list" id="landing-leaderboard-list"></ol>
          <p class="landing-leaderboard-empty" id="landing-leaderboard-empty">
            Finish a run to fill this in.
          </p>
        </aside>

        <section class="hero-panel">
          <h1 class="wordmark" aria-label="UW Zoom">
            <span class="wordmark-accent">UW</span>
            <span class="wordmark-fill">Zoom</span>
          </h1>
          <div class="hero-actions">
            <a class="button button-primary" href="/play/">Start Playing</a>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
    </footer>
    <script type="module" src="/scripts/landing.js"></script>
  </body>
</html>
