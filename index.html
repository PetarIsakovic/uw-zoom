<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UW Zoom</title>
    <meta
      name="description"
      content="UW Zoom is a minimal image-guessing game that starts absurdly zoomed in and slowly reveals the picture."
    />
    <link rel="icon" href="/University_of_Waterloo_seal.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/landing.css" />
  </head>
  <body class="landing-shell">
    <header class="site-header site-header-end">
      <nav class="header-actions" aria-label="Primary">
        <a class="ghost-button" href="/upload/">Upload</a>
      </nav>
    </header>

    <main class="landing-main">
      <div class="landing-grid">
        <aside class="landing-sidebar" aria-label="Home leaderboards">
          <section
            class="landing-leaderboard"
            id="top-streaks-board"
            aria-label="Top streaks"
            data-state="loading"
          >
            <p class="landing-leaderboard-label">Top streaks</p>
            <div class="landing-leaderboard-loading" aria-hidden="true">
              <span class="landing-loading-row"></span>
              <span class="landing-loading-row"></span>
              <span class="landing-loading-row"></span>
            </div>
            <ol class="landing-leaderboard-list" id="landing-leaderboard-list" hidden></ol>
            <p class="landing-leaderboard-empty" id="landing-leaderboard-empty" hidden>
              Finish a run to fill this in.
            </p>
          </section>

          <section
            class="landing-leaderboard"
            id="upload-leaders-board"
            aria-label="Upload leaders"
            data-state="loading"
          >
            <p class="landing-leaderboard-label">Upload leaders</p>
            <div class="landing-leaderboard-loading" aria-hidden="true">
              <span class="landing-loading-row"></span>
              <span class="landing-loading-row"></span>
              <span class="landing-loading-row"></span>
            </div>
            <ol class="landing-leaderboard-list" id="upload-count-list" hidden></ol>
            <p class="landing-leaderboard-empty" id="upload-count-empty" hidden>
              Waiting for upload names.
            </p>
          </section>
        </aside>

        <section class="hero-panel">
          <h1 class="wordmark" aria-label="UW Zoom">
            <span class="wordmark-accent">UW</span>
            <span class="wordmark-fill">Zoom</span>
          </h1>
          <div class="hero-actions">
            <a class="button button-primary" id="start-playing-link" href="/play/">
              Start Playing
            </a>
          </div>
          <p class="hero-copy">
            <a
              class="hero-note-link"
              href="https://github.com/PetarIsakovic/uw-zoom"
              target="_blank"
              rel="noreferrer"
            >
              Star this GitHub project
            </a>
            before I have to keep the site alive with couch-cushion quarters.
          </p>
        </section>
      </div>
    </main>

    <footer class="site-footer">
    </footer>
    <script type="module" src="/scripts/landing.js"></script>
  </body>
</html>
