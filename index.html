<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UW Zoom</title>
    <meta
      name="description"
      content="UW Zoom is a minimal image-guessing game that starts absurdly zoomed in and slowly reveals the picture."
    />
    <link rel="icon" href="/University_of_Waterloo_seal.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/landing.css" />
  </head>
  <body class="landing-shell">
    <header class="site-header site-header-end">
      <nav class="header-actions" aria-label="Primary">
        <a class="ghost-button" href="/upload/">Upload</a>
      </nav>
    </header>

    <main class="landing-main">
      <div class="landing-grid">
        <aside class="landing-sidebar" aria-label="Home leaderboards">
          <section
            class="landing-leaderboard"
            id="top-streaks-board"
            aria-label="Top streaks"
            data-state="loading"
          >
            <p class="landing-leaderboard-label">Top streaks</p>
            <div class="landing-leaderboard-loading" aria-hidden="true">
              <span class="landing-loading-row"></span>
              <span class="landing-loading-row"></span>
              <span class="landing-loading-row"></span>
            </div>
            <ol class="landing-leaderboard-list" id="landing-leaderboard-list" hidden></ol>
            <p class="landing-leaderboard-empty" id="landing-leaderboard-empty" hidden>
              Finish a run to fill this in.
            </p>
          </section>

          <section
            class="landing-leaderboard"
            id="online-wins-board"
            aria-label="Online wins"
            data-state="loading"
          >
            <p class="landing-leaderboard-label">Online wins</p>
            <div class="landing-leaderboard-loading" aria-hidden="true">
              <span class="landing-loading-row"></span>
              <span class="landing-loading-row"></span>
              <span class="landing-loading-row"></span>
            </div>
            <ol class="landing-leaderboard-list" id="online-wins-list" hidden></ol>
            <p class="landing-leaderboard-empty" id="online-wins-empty" hidden>
              No online wins yet.
            </p>
          </section>
        </aside>

        <section class="hero-panel">
          <h1 class="wordmark" aria-label="UW Zoom">
            <span class="wordmark-accent">UW</span>
            <span class="wordmark-fill">Zoom</span>
          </h1>
          <div class="landing-setup-card">
            <label class="field-group landing-name-field" for="landing-player-name">
              <input
                class="text-input landing-name-input"
                id="landing-player-name"
                name="playerName"
                type="text"
                maxlength="32"
                placeholder="Type your name"
                autocomplete="nickname"
              />
            </label>

            <div class="landing-avatar-stage">
              <div class="landing-avatar-preview-shell">
                <button
                  class="landing-avatar-randomize"
                  id="landing-avatar-randomize"
                  type="button"
                  aria-label="Randomize character"
                  title="Randomize character"
                >
                  <img src="/assets/randomize.gif" alt="" />
                </button>
                <div class="landing-avatar-control-pair landing-avatar-control-pair-extra">
                  <button
                    class="landing-avatar-arrow landing-avatar-arrow-mini"
                    type="button"
                    data-avatar-control="extra"
                    data-avatar-step="-1"
                    aria-label="Previous accessory"
                  >
                    &#8249;
                  </button>
                  <button
                    class="landing-avatar-arrow landing-avatar-arrow-mini"
                    type="button"
                    data-avatar-control="extra"
                    data-avatar-step="1"
                    aria-label="Next accessory"
                  >
                    &#8250;
                  </button>
                </div>
                <div class="landing-avatar-control-pair landing-avatar-control-pair-eyes">
                  <button
                    class="landing-avatar-arrow landing-avatar-arrow-mini"
                    type="button"
                    data-avatar-control="eyes"
                    data-avatar-step="-1"
                    aria-label="Previous eyes"
                  >
                    &#8249;
                  </button>
                  <button
                    class="landing-avatar-arrow landing-avatar-arrow-mini"
                    type="button"
                    data-avatar-control="eyes"
                    data-avatar-step="1"
                    aria-label="Next eyes"
                  >
                    &#8250;
                  </button>
                </div>
                <div class="landing-avatar-control-pair landing-avatar-control-pair-mouth">
                  <button
                    class="landing-avatar-arrow landing-avatar-arrow-mini"
                    type="button"
                    data-avatar-control="mouth"
                    data-avatar-step="-1"
                    aria-label="Previous mouth"
                  >
                    &#8249;
                  </button>
                  <button
                    class="landing-avatar-arrow landing-avatar-arrow-mini"
                    type="button"
                    data-avatar-control="mouth"
                    data-avatar-step="1"
                    aria-label="Next mouth"
                  >
                    &#8250;
                  </button>
                </div>
                <div class="landing-avatar-control-pair landing-avatar-control-pair-body">
                  <button
                    class="landing-avatar-arrow"
                    type="button"
                    data-avatar-control="body"
                    data-avatar-step="-1"
                    aria-label="Previous body"
                  >
                    &#8249;
                  </button>
                  <button
                    class="landing-avatar-arrow"
                    type="button"
                    data-avatar-control="body"
                    data-avatar-step="1"
                    aria-label="Next body"
                  >
                    &#8250;
                  </button>
                </div>
                <canvas
                  class="landing-avatar-preview"
                  id="landing-avatar-preview"
                  width="224"
                  height="224"
                  aria-label="Selected avatar preview"
                ></canvas>
              </div>
            </div>

            <div class="hero-actions">
              <a class="button button-primary" id="play-online-link" href="/play-online/">
                Play!
              </a>
              <a
                class="button button-secondary hero-private-room-button"
                id="create-private-room-link"
                href="/play-online/"
              >
                Create Private Room
              </a>
            </div>
            <p class="hero-copy">
              <a
                class="hero-note-link"
                href="https://github.com/PetarIsakovic/uw-zoom"
                target="_blank"
                rel="noreferrer"
              >
                Star this GitHub project
              </a>
              before I have to keep the site alive with couch-cushion quarters.
            </p>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
    </footer>
    <script type="module" src="/scripts/landing.js"></script>
  </body>
</html>
