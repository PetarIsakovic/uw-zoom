<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Over | UW Zoom</title>
    <meta
      name="description"
      content="View your UW Zoom result, score, and high score."
    />
    <link rel="icon" href="/University_of_Waterloo_seal.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/game-over.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand brand-small" href="/">UW Zoom</a>
      <nav class="header-actions" aria-label="Primary">
        <a class="ghost-button" href="/">Home</a>
      </nav>
    </header>

    <main class="game-over-layout">
      <section class="panel game-over-panel">
        <p class="eyebrow" id="result-eyebrow">Game over</p>
        <h1 class="panel-title game-over-title" id="result-title">Score 0</h1>
        <p class="panel-copy game-over-copy" id="result-copy">
          Your run is finished.
        </p>
        <p class="game-over-answer" id="result-answer" hidden></p>

        <div class="game-over-stats" aria-label="Game summary">
          <div class="stat-card">
            <span class="stat-label">Score</span>
            <strong class="stat-value" id="score-value">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">High score</span>
            <strong class="stat-value" id="high-score-value">0</strong>
          </div>
        </div>

        <div class="game-over-actions">
          <a class="button button-primary" href="/play/">Play again</a>
          <a class="button button-secondary" href="/upload/">Upload your photo</a>
        </div>

        <div class="game-over-links">
          <a
            class="ghost-button"
            href="https://github.com/PetarIsakovic/uw-zoom"
            target="_blank"
            rel="noreferrer"
          >
            Star on GitHub
          </a>
          <a class="ghost-button" href="/">Back home</a>
        </div>
      </section>
    </main>

    <script type="module" src="/scripts/game-over.js"></script>
  </body>
</html>
