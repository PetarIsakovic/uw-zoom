<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Over | uwZoom.com</title>
    <meta
      name="description"
      content="View your uwZoom.com result, score, and high score."
    />
    <link rel="icon" href="/University_of_Waterloo_seal.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/game-over.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand brand-small" href="/">uwZoom.com</a>
      <nav class="header-actions" aria-label="Primary">
        <a class="ghost-button" href="/">Home</a>
      </nav>
    </header>

    <main class="game-over-layout">
      <section class="panel game-over-panel">
        <div class="game-over-intro">
          <p class="eyebrow" id="result-eyebrow">Game over</p>
          <h1 class="panel-title game-over-title" id="result-title">Score 0</h1>
          <p class="panel-copy game-over-copy" id="result-copy">
            Your run is finished.
          </p>
          <p class="game-over-answer" id="result-answer" hidden></p>
        </div>

        <div class="game-over-summary">
          <div class="game-over-stats" aria-label="Game summary">
            <div class="stat-card">
              <span class="stat-label">Score</span>
              <strong class="stat-value" id="score-value">0</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">High score</span>
              <strong class="stat-value" id="high-score-value">0</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">Time</span>
              <strong class="stat-value" id="duration-value">0:00</strong>
            </div>
          </div>

          <form class="leaderboard-form" id="leaderboard-form" autocomplete="off">
            <label class="field-group leaderboard-field" for="leaderboard-name">
              <span class="field-label">Name for leaderboard</span>
              <input
                class="text-input"
                id="leaderboard-name"
                name="leaderboardName"
                type="text"
                maxlength="32"
                placeholder="Type your name"
                autocomplete="name"
                required
              />
            </label>
            <button class="button button-primary" id="play-again-button" type="submit">
              Save and go home
            </button>
          </form>

          <p
            class="status-message game-over-status"
            id="leaderboard-status"
            data-tone="default"
          >
            Enter your name to save this run before going home.
          </p>
        </div>

        <section class="game-over-leaderboards">
          <section
            class="game-over-leaderboard"
            id="game-over-top-streaks-board"
            aria-label="Top streaks"
            data-state="loading"
          >
            <p class="game-over-leaderboard-label">Top streaks</p>
            <div class="game-over-leaderboard-loading" aria-hidden="true">
              <span class="game-over-loading-row"></span>
              <span class="game-over-loading-row"></span>
              <span class="game-over-loading-row"></span>
            </div>
            <ol
              class="game-over-leaderboard-list"
              id="game-over-top-streaks-list"
              hidden
            ></ol>
            <p class="game-over-leaderboard-empty" id="game-over-top-streaks-empty" hidden>
              Finish a run to fill this in.
            </p>
          </section>

          <section
            class="game-over-leaderboard"
            id="game-over-online-wins-board"
            aria-label="Online wins"
            data-state="loading"
          >
            <p class="game-over-leaderboard-label">Online Wins</p>
            <div class="game-over-leaderboard-loading" aria-hidden="true">
              <span class="game-over-loading-row"></span>
              <span class="game-over-loading-row"></span>
              <span class="game-over-loading-row"></span>
            </div>
            <ol
              class="game-over-leaderboard-list"
              id="game-over-online-wins-list"
              hidden
            ></ol>
            <p class="game-over-leaderboard-empty" id="game-over-online-wins-empty" hidden>
              No online wins yet.
            </p>
          </section>
        </section>

        <div class="game-over-actions">
          <a class="button button-secondary" href="/upload/">Upload your photo</a>
        </div>

        <div class="game-over-links">
          <a
            class="ghost-button"
            href="https://github.com/PetarIsakovic/uw-zoom"
            target="_blank"
            rel="noreferrer"
          >
            Star Github
          </a>
          <a class="ghost-button" href="/">Back home</a>
        </div>
      </section>
    </main>

    <script type="module" src="/scripts/game-over.js"></script>
  </body>
</html>
