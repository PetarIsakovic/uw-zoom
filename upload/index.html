<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload | UW Zoom</title>
    <meta
      name="description"
      content="Submit an image to UW Zoom. Uploads stay pending until approved."
    />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/upload.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand brand-small" href="/">UW Zoom</a>
      <nav class="header-actions" aria-label="Primary">
        <a class="ghost-button" href="/play/">Play</a>
      </nav>
    </header>

    <main class="upload-layout">
      <section class="panel upload-panel">
        <p class="eyebrow">Submit photos</p>
        <h1 class="panel-title">Upload a new image</h1>

        <form class="upload-form" id="upload-form">
          <input
            class="file-input upload-input-hidden"
            id="image-file"
            type="file"
            name="image"
            accept="image/jpeg,image/png,image/webp"
            required
          />

          <label class="drop-zone" id="drop-zone" for="image-file" tabindex="0">
            <span class="drop-zone-kicker">Drop an image here</span>
            <span class="drop-zone-copy">or click to upload</span>
          </label>

          <figure class="file-preview" id="file-preview" hidden>
            <img id="preview-image" alt="Selected upload preview" />
          </figure>

          <div class="answer-panel" id="answer-panel" hidden>
            <label class="field-group">
              <span class="field-label">What should this image be called?</span>
              <input
                class="text-input answer-input-minimal"
                id="answer-input"
                type="text"
                name="answer"
                maxlength="80"
                placeholder="Type the answer"
                required
              />
            </label>

            <button class="button button-primary" type="submit">Upload for review</button>
          </div>
        </form>

        <p class="status-message" id="upload-status" data-tone="default">
        </p>
      </section>
    </main>

    <script type="module" src="/scripts/upload.js"></script>
  </body>
</html>
