<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload | uwZoom.com</title>
    <meta
      name="description"
      content="Submit an image to uwZoom.com. Uploads stay pending until approved."
    />
    <link rel="icon" href="/University_of_Waterloo_seal.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/upload.css" />
  </head>
  <body class="upload-page">
    <header class="site-header">
      <a class="brand brand-small" href="/">uwZoom.com</a>
      <nav class="header-actions" aria-label="Primary">
        <a class="ghost-button" href="/play/">Play</a>
      </nav>
    </header>

    <main class="upload-layout">
      <section class="panel upload-panel">
        <form class="upload-form" id="upload-form">
          <input
            class="file-input upload-input-hidden"
            id="image-file"
            type="file"
            name="image"
            accept="image/jpeg,image/png,image/webp"
            required
          />

          <label class="drop-zone" id="drop-zone" for="image-file" tabindex="0">
            <span class="drop-zone-prompt">
              <span class="drop-zone-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32" role="presentation" focusable="false">
                  <path d="M16 20V8" />
                  <path d="M11.5 12.5 16 8l4.5 4.5" />
                  <path d="M9 18.5V22a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-3.5" />
                </svg>
              </span>
              <span class="drop-zone-prompt-text" id="drop-zone-prompt-text">Upload an image here</span>
            </span>
          </label>

          <figure class="file-preview" id="file-preview" hidden>
            <img id="preview-image" alt="Selected upload preview" />
          </figure>

          <div class="answer-panel" id="answer-panel" hidden>
            <label class="field-group">
              <input
                class="text-input answer-input-minimal"
                id="answer-input"
                type="text"
                name="answer"
                maxlength="80"
                placeholder="What should this image be called?"
                aria-label="What should this image be called?"
                required
              />
            </label>

            <button class="button button-primary upload-submit-button" type="submit">
              Upload for review
            </button>
          </div>
        </form>

        <p class="status-message" id="upload-status" data-tone="default">
        </p>
      </section>
    </main>

    <script type="module" src="/scripts/upload.js"></script>
  </body>
</html>
